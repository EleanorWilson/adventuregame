# =============================================================================
# icons.properties — SVGPath "d" content for the title-bar icons
#
# All SVGPath vector data lives here, not in Java source or in FXML, so a
# designer can update or replace any icon glyph by editing this file — no
# recompile, and no FXML/Java edit needed.
#
# Loaded at startup by IconRegistry. Adding or changing an icon here requires
# NO change to IconRegistry.java — only the call site that reads the key.
#
# NOTE: this file is deliberately separate from messages.properties.
# messages.properties holds translatable, user-facing *text* (button labels,
# tooltips, prompts) and is loaded as a locale-aware ResourceBundle for
# GamePanel.fxml's %key substitution. SVG path data is not language-dependent,
# so mixing it into the localisation bundle would force every future
# translation file (messages_fr.properties, etc.) to carry unrelated vector
# data. Icons and translatable text are kept in separate files for this
# reason, even though both are simple key/value properties files.
# =============================================================================

# -----------------------------------------------------------------------------
# Theme toggle icon — shown on the title-bar theme button.
# Moon: shown while the dark theme is active (click to switch to light).
# Sun:  shown while the light theme is active (click to switch to dark).
# Sourced from the reference .svg files kept at
# src/main/resources/com/intro/ui/icons/ (moon.svg, sun.svg) on a 24x24
# viewBox. Both source SVGs use fill-rule="evenodd" (the moon's inner circle
# is subtracted from its outer circle to form the crescent, and the sun's
# ring is subtracted to leave a hollow centre); GamePanel sets
# SVGPath.setFillRule(FillRule.EVEN_ODD) on themeToggleIcon so JavaFX
# renders these holes correctly instead of filling them solid.
# -----------------------------------------------------------------------------
