# =============================================================================
# messages.properties — All player-visible UI strings
#
# Loaded by GameWindow as a java.util.ResourceBundle and passed to
# FXMLLoader. FXML elements reference these values with the %key syntax,
# e.g.  text="%ui.window.title"
#
# To add a language variant, create messages_fr.properties (French),
# messages_de.properties (German), etc. alongside this file. Java's
# ResourceBundle mechanism will select the correct file automatically
# based on the JVM's default locale.
#
# Unicode escapes (\uXXXX) are used for non-ASCII characters so the file
# remains portable across editors and build environments that may use
# different default encodings.
# =============================================================================

# --- Title bar ---------------------------------------------------------------
ui.window.title=Adventure Game

# Window-control buttons (title bar) now render SVGPath icons instead of text
# symbols (see GamePanel.fxml). These keys supply the accessible Tooltip text
# shown on hover for each button.
ui.button.minimise.tooltip=Minimise
ui.button.maximise.tooltip=Maximise / Restore
ui.button.close.tooltip=Close

# Theme toggle button tooltip (title bar). The icon itself (sun/moon) is
# swapped in code by GamePanel.handleToggleTheme() based on the active theme.
ui.button.theme.toggle=Toggle light / dark mode

# --- Input bar ---------------------------------------------------------------
# U+2026 HORIZONTAL ELLIPSIS used in the placeholder text
ui.input.prompt.placeholder=Type your response here\u2026
ui.submit.button.label=Submit
