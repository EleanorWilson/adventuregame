# =============================================================================
# config.properties — Game settings and tunable parameters
#
# Loaded at startup by GameConfig. All player-visible display strings
# (window title, button labels, prompt text) live in messages.properties
# instead, since those are loaded via ResourceBundle for FXML integration.
#
# Adding a new property here requires NO changes to GameConfig.java.
# Use GameConfig.getInt / getDouble / getBoolean / getString at the call site.
# =============================================================================

# -----------------------------------------------------------------------------
# Window dimensions (pixels)
# Default size on first launch; minimum size enforces a usable layout.
# -----------------------------------------------------------------------------
ui.window.default.width=600
ui.window.default.height=600
ui.window.min.width=400
ui.window.min.height=400

# -----------------------------------------------------------------------------
# Window resizing (pixels)
# How close the cursor must be to an edge for WindowResizeHandler to treat
# a drag as a resize instead of a normal click/drag-to-move.
# -----------------------------------------------------------------------------
ui.window.resize.margin=6

# -----------------------------------------------------------------------------
# Game balance — player starting stats
# Centralised here so tuning the feel of the game requires no recompile.
# -----------------------------------------------------------------------------
game.player.max.health=100
game.player.starting.health=100
game.player.starting.gold=0

# -----------------------------------------------------------------------------
# IO formatting
# Fixed line width for console-mode banners; fallback when GUI layout is not ready.
# content.padding.fallback = left + right inner content margin (matches game.css 60+60).
# -----------------------------------------------------------------------------
io.console.line.width=80
io.narrative.fallback.width=40
io.narrative.content.padding.fallback=120

# -----------------------------------------------------------------------------
# Feature flags
# Set to true during development to skip slow or repetitive steps.
# All flags default to false in production builds.
# -----------------------------------------------------------------------------
game.debug.enabled=false
game.debug.skip.intro=false
